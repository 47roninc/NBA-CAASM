function fmtN(v,dec){if(dec===undefined)dec=1;var n=parseFloat(v);return isNaN(n)?null:n.toFixed(dec);}

/* 3-stop gradient: purple(best) -> gold(median) -> red(worst)
   t=0 best, t=0.5 median, t=1 worst */
function gradColor3(t){
  t=Math.max(0,Math.min(1,t));
  var stops=[[148,63,255],[245,200,66],[255,71,87]];
  if(t<=0.5){
    var f=t/0.5;
    var c1=stops[0],c2=stops[1];
    return 'rgb('+Math.round(c1[0]+f*(c2[0]-c1[0]))+','+Math.round(c1[1]+f*(c2[1]-c1[1]))+','+Math.round(c1[2]+f*(c2[2]-c1[2]))+')';
  } else {
    var f=(t-0.5)/0.5;
    var c1=stops[1],c2=stops[2];
    return 'rgb('+Math.round(c1[0]+f*(c2[0]-c1[0]))+','+Math.round(c1[1]+f*(c2[1]-c1[1]))+','+Math.round(c1[2]+f*(c2[2]-c1[2]))+')';
  }
}

function statColor(stat, v, higherBetter){
  if(higherBetter===undefined)higherBetter=true;
  var n=parseFloat(v);if(isNaN(n))return 'var(--t3)';
  var r=STAT_RANGES[stat];if(!r)return 'var(--t3)';
  /* Map value to t: 0=best, 1=worst, with p50 mapping to t=0.5 */
  var t;
  if(higherBetter){
    if(n>=r.hi)t=0;
    else if(n>=r.p50)t=0.5*((r.hi-n)/(r.hi-r.p50));
    else if(n>=r.lo)t=0.5+0.5*((r.p50-n)/(r.p50-r.lo));
    else t=1;
  } else {
    if(n<=r.lo)t=0;
    else if(n<=r.p50)t=0.5*((n-r.lo)/(r.p50-r.lo));
    else if(n<=r.hi)t=0.5+0.5*((n-r.p50)/(r.hi-r.p50));
    else t=1;
  }
  return gradColor3(Math.max(0,Math.min(1,t)));
}

function numCell(v,dec,stat,higherBetter){
  if(higherBetter===undefined)higherBetter=true;
  var s=fmtN(v,dec);if(s===null)return '<span class="sna">&#8212;</span>';
  var c=statColor(stat,v,higherBetter);
  return '<span style="font-family:\'Space Mono\',monospace;font-size:11px;color:'+c+'">'+s+'</span>';
}

/* RTG and OVR use simple 2-stop gradients */
function gradColor2(t){
  t=Math.max(0,Math.min(1,t));
  var stops=[[148,63,255],[61,158,255],[0,201,122],[245,200,66],[255,107,53],[255,71,87]];
  var pos=[0,0.25,0.5,0.7,0.85,1.0];
  var i=0;while(i<pos.length-2&&t>pos[i+1])i++;
  var lo=pos[i],hi=pos[i+1],f=(t-lo)/(hi-lo);
  var c1=stops[i],c2=stops[i+1];
  return 'rgb('+Math.round(c1[0]+f*(c2[0]-c1[0]))+','+Math.round(c1[1]+f*(c2[1]-c1[1]))+','+Math.round(c1[2]+f*(c2[2]-c1[2]))+')';
}
function valColor2(v,lo,hi,higherBetter){
  if(higherBetter===undefined)higherBetter=true;
  var n=parseFloat(v);if(isNaN(n))return 'var(--t3)';
  var t=(n-lo)/(hi-lo);t=Math.max(0,Math.min(1,t));
  return gradColor2(higherBetter?1-t:t);
}
function ratColor(r){return valColor2(r,72,100,true);}
function ovrColor(o){return valColor2(o,30,100,true);}

function renderTable(){
  var body=document.getElementById('tableBody');
  var rows='';var rank=0;
  for(var i=0;i<filtered.length;i++){
    var p=filtered[i];
    if((p.rating||0)>=minRTG){rank++;rows+=renderRow(p,rank);}
  }
  body.innerHTML=rows;
  document.getElementById('countBadge').textContent=filtered.length+' players';
}
function doSort(){
  var k=sortKey,d=sortDir;
  filtered.sort(function(a,b){
    if(k==='name')return d*(a.name<b.name?-1:a.name>b.name?1:0);
    var av=parseFloat(a[k]),bv=parseFloat(b[k]);
    if(isNaN(av))av=-9999;if(isNaN(bv))bv=-9999;
    return d*(bv-av);
  });
}
function applyFilters(){
  var search=document.getElementById('srch').value.toLowerCase();
  var era=document.getElementById('eraF').value;
  var pos=document.getElementById('posF').value;
  var team=document.getElementById('teamF').value;
  var hofOnly=!!activeFilters['hof'];
  var actOnly=!!activeFilters['active'];
  minRTG=parseInt(document.getElementById('rtgF').value)||0;
  filtered=PLAYERS.filter(function(p){
    if(search&&p.name.toLowerCase().indexOf(search)<0)return false;
    if(era){var en=parseInt(era);if(!p.eras||p.eras.indexOf(en)<0)return false;}
    if(pos&&p.pos!==pos)return false;
    if(team){var fw=p.franchise_ws||{};if(!fw[team])return false;}
    if(hofOnly&&!p.hof)return false;
    if(actOnly&&!p.active)return false;
    return true;
  });
  doSort();renderTable();
}
function toggleFilter(key){
  var wasOn=!!activeFilters[key];
  activeFilters={};
  document.getElementById('hofBtn').classList.remove('active');
  document.getElementById('activeBtn').classList.remove('active');
  if(!wasOn){activeFilters[key]=true;document.getElementById(key+'Btn').classList.add('active');}
  applyFilters();
}
function updateSortHeaders(){
  var ths=document.querySelectorAll('th[data-sort]');
  for(var i=0;i<ths.length;i++){
    ths[i].classList.remove('sd','sa');
    if(ths[i].getAttribute('data-sort')===sortKey)ths[i].classList.add(sortDir===-1?'sd':'sa');
  }
}
function sortBy(key){
  if(sortKey===key){sortDir*=-1;}else{sortKey=key;sortDir=-1;}
  updateSortHeaders();doSort();renderTable();
}

/* ---- TEAM TAB: sort by team_rating (RTG while on team) ---- */
function buildTeamData(){
  var teams={};
  PLAYERS.forEach(function(p){
    var fw=p.franchise_ws||{};
    var trat=p.team_rating||{};
    var tovr=p.team_ovr||{};
    Object.keys(fw).forEach(function(fr){
      var ws=fw[fr];
      var rat=trat[fr]||p.rating||75;
      var ovr=tovr[fr]||parseFloat(p.ovr)||50;
      if(!teams[fr])teams[fr]={abbr:fr,players:[],bestRat:0};
      teams[fr].players.push({name:p.name,ws:ws,id:p.id,hof:p.hof,active:p.active,teamRat:rat,teamOvr:ovr});
      if(rat>teams[fr].bestRat)teams[fr].bestRat=rat;
    });
  });
  var result=Object.values(teams);
  result.forEach(function(t){t.players.sort(function(a,b){return b.teamRat-a.teamRat;});});
  result.sort(function(a,b){return b.bestRat-a.bestRat;});
  return result;
}

/* ---- ALPHA TAB: normalize first letter to ASCII for sorting ---- */
function normLetter(s){
  /* map accented letters to base ASCII for grouping */
  var map={'Š':'S','š':'s','Ž':'Z','ž':'z','Č':'C','č':'c','Ć':'C','ć':'c','Đ':'D','đ':'d','Ū':'U','ū':'u','Ā':'A','ā':'a','Ņ':'N','ņ':'n','Ģ':'G','ģ':'g','Ķ':'K','ķ':'k','Ļ':'L','ļ':'l','Ī':'I','ī':'i','Ó':'O','ó':'o','É':'E','é':'e','Á':'A','á':'a','Ú':'U','ú':'u'};
  return map[s]||s;
}
function renderAlpha(){
  var mode=alphaMode;var byLetter={};
  PLAYERS.forEach(function(p){
    var parts=p.name.trim().split(/\s+/);
    var word=(mode==='first')?parts[0]:parts[parts.length-1];
    if(!word||!word[0])return;
    /* Normalize the first character to ASCII for grouping */
    var rawLetter=word[0].toUpperCase();
    var letter=normLetter(rawLetter)||rawLetter;
    if(!byLetter[letter])byLetter[letter]=[];
    byLetter[letter].push(p);
  });
  var letters=Object.keys(byLetter).sort();
  var html='';
  letters.forEach(function(letter){
    var group=byLetter[letter].slice().sort(function(a,b){return b.career_pts-a.career_pts;});
    var best=group[0];var rest=group.slice(1,4);
    var r=best.rating||0;
    var rc=ratColor(r);
    var fw=best.franchise_ws||{};
    var topFr=Object.keys(fw).sort(function(a,b){return fw[b]-fw[a];})[0]||'';
    var tc=topFr?(TEAM_COLORS[topFr]||'#555'):'#555';
    var stc=(tc==='#C4CED4')?'#888':tc;
    var hofMark=best.hof?' &#11088;':(best.active?' &#128994;':'');
    var restHtml=rest.map(function(pl,i){
      return '<div class="arun"><span class="arrank">'+(i+2)+'.</span>'
        +'<span class="arname">'+(pl.hof?'&#11088; ':pl.active?'&#128994; ':'')+esc(pl.name)+'</span>'
        +'<span class="arrtg" style="color:'+ratColor(pl.rating||0)+'">'+(pl.rating||0)+'</span></div>';
    }).join('');
    html+='<div class="acard" data-playerid="'+best.id+'">'
      +'<div class="achead" style="border-left:4px solid '+stc+';background:linear-gradient(135deg,'+stc+'22,transparent)">'
        +'<div class="acletter" style="color:'+stc+'">'+letter+'</div>'
        +'<div class="acbest"><div class="acname">'+esc(best.name)+hofMark+'</div>'
        +'<div class="acmeta"><span class="acrating" style="color:'+rc+'">RTG '+r+'</span>'
        +(topFr?'<span class="acsep">|</span><span class="tchip" style="background:'+stc+'">'+topFr+'</span>':'')
        +'</div></div></div>'
      +(restHtml?'<div class="arunners">'+restHtml+'</div>':'')+'</div>';
  });
  document.getElementById('alphaContent').innerHTML=html;
  document.getElementById('alphaFirst').classList.toggle('active',mode==='first');
  document.getElementById('alphaLast').classList.toggle('active',mode==='last');
}
function setAlphaMode(m){alphaMode=m;renderAlpha();}

}
